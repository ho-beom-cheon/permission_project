# API 오류 코드를 사용자용 한국어 메시지로 변환하는 공통 메시지 카탈로그다.
# 서버 내부 예외 상세는 노출하지 않고, traceId를 이용해 로그와 연결한다.
error.unauthenticated=로그인이 필요합니다.
error.access-denied=요청한 기능을 실행할 권한이 없습니다.
error.invalid-request=요청값을 확인해 주세요.
error.not-found=요청한 대상을 찾을 수 없습니다.
error.conflict=현재 상태에서는 요청을 처리할 수 없습니다.
error.internal=요청 처리 중 오류가 발생했습니다.
