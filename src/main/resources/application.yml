# 권한·프로그램·프로젝트·공통코드를 단일 서버에서 관리하는 애플리케이션 공통 설정이다.
spring:
  application:
    name: access-management-system
  profiles:
    default: demo
  jackson:
    time-zone: Asia/Seoul

server:
  # Tailscale Serve 같은 HTTPS 역방향 프록시의 원래 요청 스킴과 호스트를 반영한다.
  forward-headers-strategy: framework
  # 외부 네트워크에 데모 계정이 노출되지 않도록 로컬 루프백 인터페이스에만 바인딩한다.
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      # 서버 세션을 권한 판정의 사용자 기준으로 사용하며 쿠키는 JavaScript에서 읽지 못하게 한다.
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

logging:
  # 업무 권한 판정과 감사 이벤트 확인에 필요한 애플리케이션 로그 수준이다.
  level:
    com.example.permissiondemo: info
