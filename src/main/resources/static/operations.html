<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>과업·이슈 | ARISU Works</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/authority-requests.css"><script type="module" src="/operations.js"></script></head>
<body><header><div><small>ARISU WORKS</small><h1>과업·이슈 관리</h1></div><nav><a href="/portal.html">사용자 홈</a><a href="/management.html">공통 업무 관리</a><a href="/community.html">게시판</a></nav></header><main><p id="feedback" role="status" aria-live="polite">과업·이슈를 확인하고 있습니다.</p>

<fieldset><legend>처리 첨부</legend><label>처리 파일 추가<input id="responseUpload" type="file" multiple></label><ul id="responseFiles"></ul></fieldset>
