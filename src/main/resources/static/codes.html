<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>공통코드 | ARISU Works</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/authority-requests.css"><script type="module" src="/codes.js"></script></head>
<body><header><div><small>ARISU WORKS</small><h1>공통코드 관리</h1></div><nav><a href="/portal.html">사용자 홈</a><a href="/management.html">기준정보</a><a href="/admin/common-code">관리자 홈</a></nav></header><main>
<p id="feedback" role="status" aria-live="polite">공통코드를 조회하고 있습니다.</p>
<section><div class="heading"><h2>그룹</h2><button id="newGroup" type="button">새 그룹</button></div><label>선택 그룹<select id="group"></select></label>
<form id="groupForm"><div class="form-grid"><label>그룹 코드<input id="groupCode" pattern="[A-Za-z0-9_]{1,30}" maxlength="30" required></label><label>그룹명<input id="groupName" maxlength="100" required></label><label>설명<input id="groupDescription" maxlength="2000"></label><label class="check"><input id="groupActive" type="checkbox" checked>사용</label></div><div class="actions"><button type="submit">그룹 저장</button><button type="button" id="deleteGroup" class="secondary">빈 그룹 삭제</button></div></form></section>
<section><div class="heading"><h2>상세·하위 코드</h2><button id="newItem" type="button">새 코드</button></div><p id="groupVersion"></p>
<div class="table-wrap"><table><thead><tr><th>상위 상세</th><th>코드</th><th>표시명</th><th>순서</th><th>사용</th><th>편집</th></tr></thead><tbody id="rows"></tbody></table></div>
<form id="itemForm"><div class="form-grid"><label>상위 상세코드<select id="parent"></select></label><label>코드<input id="code" pattern="[A-Za-z0-9_]{1,30}" maxlength="30" required></label><label>코드명<input id="name" maxlength="100" required></label><label>정렬 순서<input id="sortOrder" type="number" min="0" max="9999" value="10" required></label><label>적용 시작일<input id="validFrom" type="date"></label><label>적용 종료일<input id="validTo" type="date"></label><label>대체 코드명<input id="substituteName" maxlength="100"></label><label class="check"><input id="active" type="checkbox" checked>사용</label></div>
<label>코드 설명<textarea id="description" maxlength="2000" rows="2"></textarea></label><label>화면 표시 설명<textarea id="screenDescription" maxlength="2000" rows="2"></textarea></label>
<fieldset><legend>화면 표시 여부</legend><div id="flags" class="choices"></div></fieldset><div class="actions"><button type="submit">코드 저장</button><button id="deleteItem" type="button" class="secondary" hidden>코드 삭제</button></div></form></section>
</main></body></html>
