<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>업무 도움말 | ARISU Works</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/authority-requests.css"><script type="module" src="/help.js"></script></head>
<body><header><div><small>ARISU WORKS</small><h1>업무 도움말</h1></div><nav><a href="/portal.html">사용자 홈</a><a href="/management.html">공통 관리</a><a href="/community.html">게시판</a></nav></header><main><p id="feedback" role="status" aria-live="polite">도움말을 확인하고 있습니다.</p>
<section><div class="form-grid"><label>메뉴<select id="menuFilter"><option value="">전체</option></select></label><label>검색어<input id="query" type="search" maxlength="200"></label></div><div class="actions"><button id="search">조회</button><button id="new" hidden>새 도움말</button></div><div class="table-wrap"><table><thead><tr><th>메뉴</th><th>제목</th><th>버전</th><th>사용</th><th>열기</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination"><button id="previous">이전</button><span id="pageInfo"></span><button id="next">다음</button></div></section>
<section id="detail" hidden><h2 id="guideTitle"></h2><p id="guideMeta"></p><h3>주요 기능</h3><div id="guideFunctions" style="white-space:pre-wrap"></div><h3>유의사항</h3><div id="guideCautions" style="white-space:pre-wrap"></div><h3>참고사항</h3><div id="guideReferences" style="white-space:pre-wrap"></div><h3>법규</h3><div id="guideRegulations" style="white-space:pre-wrap"></div><h3>본문 첨부</h3><ul id="guideFiles"></ul><h3>화면 설명 첨부</h3><ul id="guideScreens"></ul><div class="actions"><button id="edit" hidden>수정</button><button id="delete" class="secondary" hidden>삭제</button></div><div id="historySection" hidden><label>변경 이력<select id="history"></select></label><p>선택한 버전의 원문과 첨부파일을 확인합니다.</p></div></section>
<section id="editorSection" hidden><h2>도움말 작성</h2><form id="editor"><div class="form-grid"><label>연결 메뉴<select id="menuId" required></select></label><label>도움말 구분 코드<input id="type" value="04" pattern="[A-Za-z0-9_]{1,30}" required></label><label>제목<input id="title" maxlength="200" required></label><label class="check"><input id="active" type="checkbox" checked>사용</label></div><label>주요 기능<textarea id="majorFunctions" rows="6" maxlength="50000" required></textarea></label><label>유의사항<textarea id="cautions" rows="3" maxlength="20000"></textarea></label><label>참고사항<textarea id="references" rows="3" maxlength="20000"></textarea></label><label>법규<textarea id="regulations" rows="3" maxlength="20000"></textarea></label>
<label>본문 첨부 (각 10MB, 최대 10개)<input id="fileUpload" type="file" multiple></label><ul id="editFiles"></ul><label>화면 설명 첨부 (각 10MB, 최대 10개)<input id="screenUpload" type="file" multiple></label><ul id="editScreens"></ul><div class="actions"><button id="save" type="submit">저장</button><button id="cancel" type="button" class="secondary">작성 취소</button></div></form></section>
</main></body></html>
