<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>권한 처리 이력 | ARISU Works</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/authority-requests.css">
<script type="module" src="/authority-history.js"></script></head>
<body><header><div><small>ARISU WORKS</small><h1>권한 처리 이력</h1></div>
<nav><a href="/portal.html">사용자 홈</a><a href="/authority-requests.html">권한 신청·심사</a><a href="/authority-revocations.html">사용자 일괄 회수</a></nav></header>
<main><p id="feedback" role="status" aria-live="polite"></p>
<section>
<p>현재 처리 기록과 이전 신청·권한 기록을 함께 조회합니다. 연결을 확인할 수 없는 이전 기록은 출처별로 표시하며, 건수는 처리 횟수가 아닌 기록 수입니다. 알 수 없는 시각·기간·사유는 ‘확인 불가’로 표시합니다.</p>
<div class="form-grid">
<label id="scopeField" hidden>조회 범위<select id="scope"><option value="mine">내 이력</option><option value="all">전체 사용자</option></select></label>
<label id="usernameField" hidden>사용자 ID<input id="username" maxlength="50" placeholder="비우면 전체 사용자"></label>
<label>처리 상태<select id="status"><option value="">전체</option><option value="PENDING">신청</option><option value="APPROVED">승인·부여</option><option value="REJECTED">반려</option><option value="REVOKED">회수</option></select></label>
</div><button id="search" type="button">조회</button>
<div class="table-wrap"><table><thead><tr><th>출처 / 번호</th><th>사용자 / 조직</th><th>권한 / 유형</th><th>처리 상태</th><th>적용 기간</th><th>등록 일시</th><th>처리자 / 처리 일시</th><th>사유</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pagination"><button id="previous" type="button" disabled>이전</button><span id="pageInfo"></span><button id="next" type="button" disabled>다음</button></div>
</section></main></body></html>
