<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>내 정보와 일정 | ARISU Works</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/authority-requests.css"><script type="module" src="/my-page.js"></script></head>
<body><header><div><small>ARISU WORKS</small><h1>내 정보와 일정</h1></div><nav><a href="/portal.html">사용자 홈</a><a href="/authority-requests.html">권한 신청</a><a href="/community.html">게시판</a></nav></header><main><p id="feedback" role="status" aria-live="polite">내 정보를 확인하고 있습니다.</p>
<section><h2>내 정보</h2><p id="identity"></p><form id="profileForm"><div class="form-grid"><label>전화번호<input id="telephone" maxlength="30"></label><label>휴대전화<input id="mobile" maxlength="30"></label><label>이메일<input id="email" type="email" maxlength="150"></label><label>담당업무<input id="jobDescription" maxlength="1000"></label></div><button type="submit">연락처·담당업무 저장</button></form></section>
<section><h2>비밀번호 변경</h2><form id="passwordForm"><div class="form-grid"><label>현재 비밀번호<input id="currentPassword" type="password" autocomplete="current-password" maxlength="72" required></label><label>새 비밀번호<input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><label>새 비밀번호 확인<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label></div><p>12자 이상, UTF-8 기준 72바이트 이하로 입력하세요.</p><button type="submit">비밀번호 변경</button></form></section>
<section><div class="heading"><h2>개인 일정</h2><button id="newSchedule" type="button">새 일정</button></div><div class="form-grid"><label>조회 월<input id="month" type="month"></label></div><div class="table-wrap"><table><thead><tr><th>일정명</th><th>분류</th><th>기간</th><th>상태</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div>
<form id="scheduleForm"><div class="form-grid"><label>일정명<input id="name" maxlength="200" required></label><label>분류 코드<input id="category" value="PERSONAL" pattern="[A-Za-z0-9_]{1,30}" maxlength="30" required></label><label>시작 일시<input id="start" type="datetime-local" required></label><label>종료 일시<input id="end" type="datetime-local" required></label><label>상태<select id="status"><option value="OPEN">예정</option><option value="DONE">완료</option><option value="CANCELLED">취소</option></select></label></div><label>내용<textarea id="body" maxlength="10000" rows="4"></textarea></label><div class="actions"><button type="submit">일정 저장</button><button id="deleteSchedule" type="button" class="secondary" hidden>일정 삭제</button></div></form></section>
</main></body></html>
