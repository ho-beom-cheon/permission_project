<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>사용자 권한 일괄 회수 | ARISU Works</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/authority-requests.css"><script type="module" src="/authority-revocations.js"></script></head>
<body><header><div><small>ARISU WORKS</small><h1>사용자 권한 일괄 회수</h1></div><nav><a href="/portal.html">사용자 홈</a><a href="/admin/authority">권한 관리</a><a href="/authority-requests.html">권한 신청·심사</a></nav></header><main><p id="feedback" role="status" aria-live="polite">권한 회수 대상을 확인하고 있습니다.</p>
<section><div class="form-grid"><label>시스템<select id="system"></select></label><label class="check"><input id="includeDelegated" type="checkbox">위임 권한도 함께 회수</label></div><div class="table-wrap"><table><thead><tr><th>선택</th><th>사용자</th><th>현재 조직</th><th>사용</th></tr></thead><tbody id="users"></tbody></table></div><div class="actions"><button id="refresh" type="button">대상 새로고침</button><button id="preview" type="button">회수할 권한 미리 확인</button></div></section>
<section><h2>회수 예정 권한</h2><p>선택한 시스템·현재 조직의 승인 권한을 회수합니다. 다른 시스템의 권한과 선택하지 않은 위임은 유지됩니다.</p><div class="table-wrap"><table><thead><tr><th>사용자</th><th>조직</th><th>권한</th><th>부여 유형</th></tr></thead><tbody id="planned"></tbody></table></div><label>회수 사유<textarea id="reason" maxlength="1000" rows="3" required></textarea></label><button id="revoke" type="button" disabled>미리 확인한 권한 회수</button></section>
</main></body></html>
